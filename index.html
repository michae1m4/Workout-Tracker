<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workouts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap">
  <link rel="stylesheet" href="styles.css?v=33">
</head>
<body>

  <!-- OPENING LOGO SCREEN: plays on first open and after an hour or more away (see splash.js) -->
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 180 180">
      <defs>
        <clipPath id="spClip"><g>
          <rect x="22" y="71" width="15" height="37" rx="7"/><rect x="38" y="60" width="15" height="59" rx="7"/><rect x="53" y="83" width="74" height="13"/>
          <rect x="127" y="60" width="15" height="59" rx="7"/><rect x="143" y="71" width="15" height="37" rx="7"/></g></clipPath>
        <linearGradient id="spSoft" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop id="sf1" offset=".29" stop-color="#fff"/><stop id="sf2" offset=".71" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
        <mask id="spWipe" maskUnits="userSpaceOnUse" x="-80" y="0" width="340" height="180"><rect id="wipeR" x="-10" y="0" width="200" height="180" fill="url(#spSoft)"/></mask>
        <linearGradient id="spShine" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop id="spMid" offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <g id="spAll">
        <g class="spOutline">
          <rect id="oL"/><rect id="iL"/><rect id="bar"/><rect id="iR"/><rect id="oR"/>
        </g>
        <g class="spFill" mask="url(#spWipe)">
          <rect id="f_oL" x="22" y="71" width="15" height="37" rx="7"/>
          <rect id="f_iL" x="38" y="60" width="15" height="59" rx="7"/>
          <rect id="f_bar" x="53" y="83" width="74" height="13"/>
          <rect id="f_iR" x="127" y="60" width="15" height="59" rx="7"/>
          <rect id="f_oR" x="143" y="71" width="15" height="37" rx="7"/>
        </g>
        <g clip-path="url(#spClip)"><rect id="spBand" x="-60" y="40" width="50" height="100" fill="url(#spShine)" transform="skewX(-18)" style="transform-box:view-box;transform-origin:0 0"/></g>
      </g>
    </svg>
  </div>
  <script src="splash.js?v=33"></script>

  <!-- SETUP VIEW: shown once, asks for the secret key -->
  <div id="setupView" class="hidden">
    <h1>Connect</h1>
    <div class="card">
      <label>Secret key</label>
      <input id="keyInput" type="password" placeholder="Paste your key" autocomplete="off" autocapitalize="off">
      <div class="actions"><button onclick="saveKey()">Connect</button></div>
      <div id="setupMsg" class="msg"></div>
    </div>
  </div>

  <!-- HOME TAB -->
  <div id="homeView" class="hidden">
    <h1 id="homeTitle">Home</h1>
    <div id="homeDate" class="homedate"></div>
    <div id="homeBody"></div>
    <div class="ver">Version 33</div>
  </div>

  <!-- SCHEDULE SCREEN -->
  <div id="scheduleView" class="hidden">
    <button class="back" onclick="showTab('home')">‹ Home</button>
    <h1>Schedule</h1>
    <div class="homedate">Pick the workout you plan to do each day. It repeats every week.</div>
    <div id="scheduleRows" class="card"></div>
  </div>

  <!-- LIBRARY TAB -->
  <div id="listView" class="hidden">
    <h1>Library</h1>
    <div id="list"></div>
    <button class="full" onclick="showEditor()">+ Create New Workout</button>
  </div>

  <!-- HISTORY TAB (placeholder for now) -->
  <div id="historyView" class="hidden">
    <h1>History</h1>
    <div id="historyList"></div>
  </div>

  <!-- PROGRESS TAB (placeholder for now) -->
  <div id="progressView" class="hidden">
    <h1>Progress</h1>
    <select id="progPick" class="hidden"></select>
    <div id="progBody" style="margin-top:14px"></div>
  </div>

  <!-- BUILDER VIEW -->
  <div id="builderView" class="hidden">
    <button id="builderBack" class="back" onclick="leaveEditor()">‹ Library</button>
    <h1 id="builderTitle">New Workout</h1>
    <label>Workout name</label>
    <input id="workoutName" placeholder="e.g. Push Day">
    <div id="exerciseRows" style="margin-top:12px"></div>
    <button class="secondary full" onclick="addRow(null, true)">+ Add exercise</button>
    <div class="actions">
      <button id="builderSave" onclick="saveCurrent()">Save workout</button>
      <button class="secondary" onclick="leaveEditor()">Cancel</button>
    </div>
    <div id="builderMsg" class="msg"></div>
    <button id="builderDelete" class="danger full hidden" onclick="deleteCurrentWorkout()">Delete workout</button>
  </div>

  <!-- RUN VIEW -->
  <div id="runView" class="hidden">
    <h1 id="runTitle"></h1>
    <div id="runBody"></div>
    <div class="actions">
      <button onclick="finishWorkout()">Finish workout</button>
    </div>
  </div>

  <!-- FINISH SCREEN: confirms the sets reached your Sheet -->
  <div id="finishView" class="overlay hidden">
    <div id="finishIcon" class="bigcheck wait"></div>
    <h2 id="finishTitle"></h2>
    <p id="finishSub"></p>
    <button id="finishRetry" class="secondary hidden" onclick="flushQueue()">Retry now</button>
    <button id="finishDone" class="hidden" onclick="closeFinish()">Done</button>
  </div>

  <!-- BOTTOM TAB BAR -->
  <nav id="tabBar" class="tabbar hidden">
    <button class="tab" data-tab="home" onclick="showTab('home')">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="list" onclick="showTab('list')">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="7" rx="2"/><rect x="4" y="14" width="16" height="7" rx="2"/></svg>
      <span>Library</span>
    </button>
    <button class="tab" data-tab="history" onclick="showTab('history')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-tab="progress" onclick="showTab('progress')">
      <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
      <span>Progress</span>
    </button>
  </nav>

  <!-- small pill showing background saving status -->
  <div id="syncStatus" class="sync hidden" onclick="flushQueue()"></div>

  <script src="config.js?v=33"></script>
  <script src="app.js?v=33"></script>
</body>
</html>
