<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workouts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body>

  <!-- SETUP VIEW: shown once, asks for the secret key -->
  <div id="setupView" class="hidden">
    <h1>Connect</h1>
    <div class="card">
      <label>Secret key</label>
      <input id="keyInput" type="password" placeholder="Paste your key" autocomplete="off" autocapitalize="off">
      <div class="actions"><button onclick="saveKey()">Connect</button></div>
      <div id="setupMsg" class="msg"></div>
    </div>
  </div>

  <!-- LIBRARY TAB -->
  <div id="listView" class="hidden">
    <h1>Library</h1>
    <div id="list"></div>
    <button class="full" onclick="showEditor()">+ New workout</button>
    <div class="ver">Version 17</div>
  </div>

  <!-- HISTORY TAB (placeholder for now) -->
  <div id="historyView" class="hidden">
    <h1>History</h1>
    <div id="historyList"></div>
    <div class="ver">Version 17</div>
  </div>

  <!-- PROGRESS TAB (placeholder for now) -->
  <div id="progressView" class="hidden">
    <h1>Progress</h1>
    <select id="progPick" class="hidden"></select>
    <div id="progBody" style="margin-top:14px"></div>
    <div class="ver">Version 17</div>
  </div>

  <!-- BUILDER VIEW -->
  <div id="builderView" class="hidden">
    <button class="back" onclick="showList()">‹ Library</button>
    <h1 id="builderTitle">New Workout</h1>
    <label>Workout name</label>
    <input id="workoutName" placeholder="e.g. Push Day">
    <div id="exerciseRows" style="margin-top:12px"></div>
    <button class="secondary full" onclick="addRow()">+ Add exercise</button>
    <div class="actions">
      <button id="builderSave" onclick="saveCurrent()">Save workout</button>
      <button class="secondary" onclick="showList()">Cancel</button>
    </div>
    <div id="builderMsg" class="msg"></div>
  </div>

  <!-- RUN VIEW -->
  <div id="runView" class="hidden">
    <h1 id="runTitle"></h1>
    <div id="runBody"></div>
    <div class="actions">
      <button onclick="finishWorkout()">Finish workout</button>
    </div>
  </div>

  <!-- FINISH SCREEN: confirms the sets reached your Sheet -->
  <div id="finishView" class="overlay hidden">
    <div id="finishIcon" class="bigcheck wait"></div>
    <h2 id="finishTitle"></h2>
    <p id="finishSub"></p>
    <button id="finishRetry" class="secondary hidden" onclick="flushQueue()">Retry now</button>
    <button id="finishDone" class="hidden" onclick="closeFinish()">Done</button>
  </div>

  <!-- BOTTOM TAB BAR -->
  <nav id="tabBar" class="tabbar hidden">
    <button class="tab" data-tab="list" onclick="showTab('list')">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="7" rx="2"/><rect x="4" y="14" width="16" height="7" rx="2"/></svg>
      <span>Library</span>
    </button>
    <button class="tab" data-tab="history" onclick="showTab('history')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-tab="progress" onclick="showTab('progress')">
      <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
      <span>Progress</span>
    </button>
  </nav>

  <!-- invisible full-screen element, used to make iOS re-measure the screen after typing -->
  <div id="healer" aria-hidden="true"></div>

  <!-- small pill showing background saving status -->
  <div id="syncStatus" class="sync hidden" onclick="flushQueue()"></div>

  <script src="config.js?v=17"></script>
  <script src="app.js?v=17"></script>
</body>
</html>
