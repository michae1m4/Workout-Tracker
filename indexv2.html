<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workouts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

  <!-- SETUP VIEW: shown once, asks for the secret key -->
  <div id="setupView" class="hidden">
    <h1>Connect</h1>
    <div class="card">
      <label>Secret key</label>
      <input id="keyInput" type="password" placeholder="Paste your key" autocomplete="off" autocapitalize="off">
      <div class="actions"><button onclick="saveKey()">Connect</button></div>
      <div id="setupMsg" class="msg"></div>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div id="listView" class="hidden">
    <h1>My Workouts</h1>
    <div id="list">Loading...</div>
    <button class="full" onclick="showBuilder()">+ New workout</button>
  </div>

  <!-- BUILDER VIEW -->
  <div id="builderView" class="hidden">
    <h1>New Workout</h1>
    <label>Workout name</label>
    <input id="workoutName" placeholder="e.g. Push Day">
    <div id="exerciseRows" style="margin-top:12px"></div>
    <button class="secondary full" onclick="addRow()">+ Add exercise</button>
    <div class="actions">
      <button onclick="saveCurrent()">Save workout</button>
      <button class="secondary" onclick="showList()">Cancel</button>
    </div>
    <div id="builderMsg" class="msg"></div>
  </div>

  <!-- RUN VIEW -->
  <div id="runView" class="hidden">
    <h1 id="runTitle"></h1>
    <div id="runBody"></div>
    <div class="actions">
      <button onclick="showList()">Finish workout</button>
    </div>
  </div>

  <script src="config.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
